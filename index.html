<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Man VS Banana</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="assets/banana_yellow.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #fs { position: fixed; top: max(4px, env(safe-area-inset-top)); right: max(4px, env(safe-area-inset-right)); z-index: 10;
            width: 32px; height: 32px; border: 2px solid rgba(255,255,255,.7); border-radius: 8px; background: rgba(0,0,0,.35);
            color: #fff; font-size: 18px; line-height: 1; padding: 0; opacity: .75; }
      #orientation-hint { display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center; justify-content: center;
            padding: 28px; box-sizing: border-box; background: #111; color: #fff; text-align: center;
            font: 900 clamp(22px, 5vw, 34px)/1.35 Nunito, sans-serif; }
      #orientation-hint small { display: block; margin-top: 12px; color: #f7d93a; font-size: .65em; }
      body.portrait-gate #game { visibility: hidden; }
      body.portrait-gate #orientation-hint { display: flex; }
      body.landscape-gate #orientation-hint { display: block; inset: 8px 48px auto auto; padding: 8px 12px; border-radius: 8px;
            background: rgba(0,0,0,.72); font-size: 14px; line-height: 1.2; }
      body.landscape-gate #orientation-hint small { margin-top: 3px; }
      #fs-arrow { display: none; position: fixed; top: 38px; right: 8px; z-index: 11; color: #f7d93a;
            font: 900 36px/1 Nunito, sans-serif; filter: drop-shadow(0 2px 3px #000); animation: point-up .7s ease-in-out infinite alternate;
            pointer-events: none; }
      @keyframes point-up { from { transform: translateY(5px); } to { transform: translateY(-3px); } }
      body.landscape-gate #fs-arrow { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
